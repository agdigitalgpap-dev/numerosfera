<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    background: #060610;
    font-family: 'Georgia', serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    width: 1080px;
    height: 1080px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center,
      #0f0f22 0%,
      #090912 50%,
      #060610 100%
    );
  }

  /* Brilho dourado central */
  .glow {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center,
      rgba(196,164,72,0.12) 0%,
      rgba(196,164,72,0.04) 40%,
      transparent 70%
    );
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  /* Círculo externo decorativo */
  .ring-outer {
    position: absolute;
    width: 820px;
    height: 820px;
    border-radius: 50%;
    border: 1px solid rgba(196,164,72,0.15);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .ring-mid {
    position: absolute;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    border: 1px solid rgba(196,164,72,0.25);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  /* Partículas / estrelas */
  .star {
    position: absolute;
    border-radius: 50%;
    background: #F5E199;
  }

  /* SVG central */
  .logo-wrap {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .brand-name {
    font-size: 36px;
    letter-spacing: 14px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #F5E199 0%, #D4A84B 50%, #B8922A 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 400;
    filter: drop-shadow(0 0 20px rgba(196,164,72,0.4));
  }

  .brand-sub {
    font-size: 13px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(184,146,42,0.5);
  }
</style>
</head>
<body>
<div class="container">

  <!-- Brilho -->
  <div class="glow"></div>

  <!-- Anéis -->
  <div class="ring-outer"></div>
  <div class="ring-mid"></div>

  <!-- Estrelas decorativas -->
  <div class="star" style="width:2px;height:2px;top:180px;left:280px;opacity:0.7;"></div>
  <div class="star" style="width:1.5px;height:1.5px;top:240px;left:760px;opacity:0.6;"></div>
  <div class="star" style="width:2px;height:2px;top:320px;left:160px;opacity:0.5;"></div>
  <div class="star" style="width:1.5px;height:1.5px;top:140px;left:540px;opacity:0.8;"></div>
  <div class="star" style="width:2px;height:2px;top:880px;left:340px;opacity:0.6;"></div>
  <div class="star" style="width:1.5px;height:1.5px;top:900px;left:700px;opacity:0.5;"></div>
  <div class="star" style="width:2px;height:2px;top:760px;left:900px;opacity:0.7;"></div>
  <div class="star" style="width:1.5px;height:1.5px;top:440px;left:80px;opacity:0.55;"></div>

  <!-- Logo + Nome -->
  <div class="logo-wrap">

    <!-- Símbolo SVG da Numerosfera (ampliado) -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="380" height="380"
         style="filter: drop-shadow(0 0 24px rgba(196,164,72,0.5));">
      <defs>
        <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#F5E199"/>
          <stop offset="45%"  stop-color="#EEC96A"/>
          <stop offset="100%" stop-color="#B8922A"/>
        </linearGradient>
        <radialGradient id="g2" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#F5E199"/>
          <stop offset="100%" stop-color="#D4A84B"/>
        </radialGradient>
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Círculo externo -->
      <circle cx="100" cy="100" r="91" fill="none" stroke="#5C4415" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(92,68,21,0.4)" stroke-width="0.5"/>

      <!-- Marcações de graus -->
      <g transform="translate(100,100)" stroke="#B8922A" stroke-width="1.2" opacity="0.9">
        <line x1="0" y1="-88" x2="0" y2="-76" transform="rotate(0)"/>
        <line x1="0" y1="-88" x2="0" y2="-76" transform="rotate(30)"/>
        <line x1="0" y1="-88" x2="0" y2="-76" transform="rotate(60)"/>
        <line x1="0" y1="-88" x2="0" y2="-76" transform="rotate(90)"/>
        <line x1="0" y1="-88" x2="0" y2="-76" transform="rotate(120)"/>
        <line x1="0" y1="-88" x2="0" y2="-76" transform="rotate(150)"/>
        <line x1="0" y1="-88" x2="0" y2="-76" transform="rotate(180)"/>
        <line x1="0" y1="-88" x2="0" y2="-76" transform="rotate(210)"/>
        <line x1="0" y1="-88" x2="0" y2="-76" transform="rotate(240)"/>
        <line x1="0" y1="-88" x2="0" y2="-76" transform="rotate(270)"/>
        <line x1="0" y1="-88" x2="0" y2="-76" transform="rotate(300)"/>
        <line x1="0" y1="-88" x2="0" y2="-76" transform="rotate(330)"/>
      </g>

      <!-- Pontas cardinais -->
      <g fill="#D4A84B" opacity="0.85">
        <polygon points="100,9  103.5,18 100,27 96.5,18"/>
        <polygon points="191,97 182,100.5 191,104 200,100.5"/>
        <polygon points="100,191 103.5,182 100,173 96.5,182"/>
        <polygon points="9,97   18,100.5 9,104  0,100.5"/>
      </g>

      <!-- Estrela de Davi / triângulos -->
      <polygon points="100,28 162,134 38,134" fill="none" stroke="url(#g1)" stroke-width="1.2" opacity="0.7"/>
      <polygon points="100,172 162,66 38,66"  fill="none" stroke="url(#g1)" stroke-width="1.2" opacity="0.7"/>

      <!-- Círculo interno -->
      <circle cx="100" cy="100" r="66" fill="none" stroke="#5C4415" stroke-width="0.8" opacity="0.6"/>

      <!-- Círculo central -->
      <circle cx="100" cy="100" r="30" fill="rgba(212,168,75,0.05)" stroke="#D4A84B" stroke-width="1" opacity="0.8"/>

      <!-- Cruz central com brilho -->
      <g transform="translate(100,100)" stroke="url(#g1)" stroke-width="1.4" opacity="0.95" filter="url(#glow)">
        <line x1="0" y1="-20" x2="0" y2="20"/>
        <line x1="-20" y1="0"  x2="20" y2="0"/>
        <line x1="-14" y1="-14" x2="14" y2="14"/>
        <line x1="14"  y1="-14" x2="-14" y2="14"/>
      </g>

      <!-- Ponto central -->
      <circle cx="100" cy="100" r="5" fill="url(#g2)" filter="url(#glow)"/>
      <circle cx="100" cy="100" r="2.5" fill="#F5E199"/>
    </svg>

    <p class="brand-name">Numerosfera</p>
    <p class="brand-sub">Astrologia Hermética</p>
  </div>

</div>
</body>
</html>
